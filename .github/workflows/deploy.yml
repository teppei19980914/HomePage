name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # ブログ記事の予約投稿（date が今日以前の記事を自動公開）
    # + Qiita 記事・年齢・社会人歴の自動更新もカバー
    #
    # ■ 設計
    #   - 公開判定は isPublished() が「JST の日付 (YYYY-MM-DD)」で行う。
    #     UTC 15:00（= JST 0:00）以降に実行されれば当日記事が公開対象になる。
    #   - ビルドは冪等: 何度実行しても「date <= 今日(JST)」の記事を全公開するだけ。
    #     そのため複数回実行しても重複・副作用はない。
    #
    # ■ 冗長化の理由（重要）
    #   GitHub Actions の scheduled workflow は高負荷時に **数十分〜数時間遅延、
    #   最悪スキップ** されることがある（実際 UTC 21:00 指定が 22:41 に遅延した実績あり）。
    #   1 日 1 回だと、その回が遅延・スキップされると朝の予約投稿が公開されない。
    #   → JST 早朝に複数回トライし、いずれか 1 回が走れば確実に公開されるようにする。
    #   → 毎時 :00 は GitHub 全体で最も混雑し遅延しやすいため、オフピークの分を指定。
    - cron: "11 21 * * *"  # JST 06:11 — 主たる公開タイミング
    - cron: "11 22 * * *"  # JST 07:11 — バックアップ 1
    - cron: "11 23 * * *"  # JST 08:11 — バックアップ 2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
